[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swiggy-delivery"
version = "0.1.0"
description = "Food delivery time prediction with a chronological split, naive baseline, and a statistically tested model tournament"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "joblib",
    "xgboost",
    "lightgbm",
    "tabpfn",
]

[project.optional-dependencies]
notebooks = ["matplotlib", "seaborn", "missingno", "plotly", "ipykernel", "nbformat"]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
